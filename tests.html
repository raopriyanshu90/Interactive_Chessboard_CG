<!doctype html><html><head><meta charset="utf-8"><title>CG Chessboard Tests</title></head><body><h1>Automated Tests</h1><pre id="results"></pre><script src="js/board.js"></script><script src="js/logic.js"></script><script src="js/graphics-lab.js"></script><script>const tests=[['8x8 board',()=>initialBoard().length===8&&initialBoard().every(r=>r.length===8)],['initial 32 pieces',()=>initialBoard().flat().filter(Boolean).length===32],['pawn opening 2 moves',()=>legalMoves(initialBoard(),6,4).length===2],['knight opening 2 moves',()=>legalMoves(initialBoard(),7,1).length===2],['DDA endpoints',()=>JSON.stringify(dda(0,0,4,2)[0])==='[0,0]'&&JSON.stringify(dda(0,0,4,2).at(-1))==='[4,2]'],['Bresenham endpoints',()=>JSON.stringify(bresenham(0,0,4,2).at(-1))==='[4,2]'],['circle symmetry',()=>midpointCircle(10,10,5).some(([x,y])=>x===15&&y===10)],['coordinate mapping',()=>cellCenter(0,0).x===40&&cellCenter(7,7).y===600]];let passed=0;document.getElementById('results').textContent=tests.map(([name,fn])=>{let ok=false;try{ok=fn()}catch(e){console.error(e)}if(ok)passed++;return `${ok?'PASS':'FAIL'} ${name}`}).join('\n')+`\n\n${passed}/${tests.length} tests passed`;</script></body></html>
